name: Update hubs.json

on:
  schedule:
    - cron: '17 * * * *'      # a cada hora, no minuto 17
  workflow_dispatch:           # permite rodar manualmente na aba Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar e validar
        run: |
          curl -fsS --retry 3 --max-time 60 -o hubs.tmp https://gtfo.fixedbit.com/api/hubs
          python3 - <<'EOF'
          import json
          d = json.load(open('hubs.tmp', encoding='utf-8'))
          hubs = d.get('hubs')
          assert isinstance(hubs, list) and len(hubs) > 100, 'resposta inesperada'
          for h in hubs:
              h.pop('last_seen', None)   # muda a cada coleta; sem isso haveria um commit por hora
          json.dump(d, open('hubs.json', 'w', encoding='utf-8'),
                    separators=(',', ':'), ensure_ascii=False)
          EOF
          rm hubs.tmp

      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hubs.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Update hubs.json"
            git push
          fi
